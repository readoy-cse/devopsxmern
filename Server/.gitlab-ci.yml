stages:
  - build
  - update-manifest

build-image:
    stage: build
    image: docker
    services:
      - name: docker:dind
        alias: docker
        command: ["--tls=false"]

    variables:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""

    script:
      - echo "Commit Sha = $CI_COMMIT_SHORT_SHA"
      - docker build -t frontend .
      - docker tag frontend $HarborRepo/$HrProject/backend:$CI_COMMIT_SHORT_SHA
      - echo "$HrPasswd" | docker login $HarborRepo -u $HrUser --password-stdin
      - docker push $HarborRepo/$HrProject/backend:$CI_COMMIT_SHORT_SHA

update-manifest:
    stage: update-manifest
    image: alpine:latest
    before_script:
      - apk add --no-cache git
    script:
      - echo "Updating manifest for backend image"
      - git clone http://oauth2:${Manifest_Token}@${Manifest_Repo}
      - cd frienemie-manifest/deployments
      - sed -i "s|$HarborRepo/$HrProject/backend.*$|$HarborRepo/$HrProject/backend:$CI_COMMIT_SHORT_SHA|" backend-deployment.yml
      - git config user.email "$Gitlab_Email"
      - git config user.name "$Gitlab_User"
      - git add backend-deployment.yml
      - git commit -m "Update backend image to $CI_COMMIT_SHORT_SHA"
      - git push -u origin main